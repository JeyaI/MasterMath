level1:
  statement: "A chessboard has four gems on its diagonal, in the first four squares from one corner. Cut
    the board along the lines between squares into four parts of exactly the same size and shape, so that
    every part holds one gem. Can you do it?"
  answer: "Yes. Each part is a long hook of 16 squares, and each is the first hook turned by a quarter
    turn."
  insight: "The gems are crowded into one corner, so straight cuts and quarters always put two gems in
    one part. Instead, draw one long hook from the first gem, a column down the edge and a row along the
    bottom, ending in a small curl. Turn it a quarter turn and it fits around the next gem. Three more
    turns give the four parts, 16 squares each, one gem in each."
level2:
  statement: "The Grand Lama's next board is 12 by 12, and he wants it cut into 9 parts of exactly the
    same size and shape. How many squares does each part hold?"
  answer: 16
  accept: [16, "16 squares", "sixteen", "16 each", "sixteen squares"]
  why: "The board has 12 x 12 = 144 squares, and 9 equal parts share them equally: 144 / 9 = 16. Such
    a cut exists, and verify.py builds one and checks it."
captions:
  - "Can you cut this board into four identical parts, one gem in each?"
  - "A Grand Lama has a golden chessboard with four gems."
  - "The gems sit in a row along the diagonal."
  - "Cut along the lines into four parts of the same size and shape."
  - "Every part must hold exactly one gem."
  - "Let me try the obvious cut: four equal quarters."
  - "That fails, because one quarter holds every gem."
  - "Pause and try it."
  - "Straight strips fail as well, so the parts must bend."
  - "Start with a long hook that wraps around the first gem."
  - "Turn the hook a quarter turn, and it fits around the next gem."
  - "Turn it again and again, until the board is full."
  - "Four identical hooks of 16 squares, one gem each ✓"
  - "Level 2: a 12 by 12 board is cut into 9 equal parts."
  - "How many squares does each part hold?"
  - "Comment just the number ↓"
