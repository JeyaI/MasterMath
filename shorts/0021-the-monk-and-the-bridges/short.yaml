  - "A monk wants to walk home to the monastery."
  - "Two bridges reach the island, two leave it, and one crosses directly."
  - "He must cross every bridge once, and only once."
  - "How many different routes could he take?"
  - "Pause and try it."
  - "Every route has to start at the monk and end at the monastery."
  - "Let's call the bridges a, b, c, d and e."
  - "The two bridges in each pair are twins, so ignore their names for now."
  - "Let's redraw it as a simple map: three places, joined by five bridges."
  - "Looking only at the places he visits, there are just four different shapes."
  - "In every shape, the first pair of twins can be named in two ways."
  - "The second pair of twins can be named in two ways too."
  - "So each shape gives 2 times 2, which is 4 routes."
  - "Four shapes times four names makes 16 routes ✓"
  - "Level 2: the same river, with six bridges and a walk back to the start."
  - "Same trick: how many routes are there now?"
  - "Comment just the number ↓"
