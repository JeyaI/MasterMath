  - "The quadratic formula gives x as 44 plus or minus 28, over 24."
  - "So x is 3 or two thirds, but 3 feet is too big."
  - "The slope turns from positive to negative at two thirds: the peak."
  - "At two thirds of a foot, the volume is 200 over 27 cubic feet."
  - "The squares should be two thirds of a foot, or eight inches ✓"
