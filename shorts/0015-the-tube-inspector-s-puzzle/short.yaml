source:
  kind: dudeney-amusements
  credit: After Henry Ernest Dudeney, Amusements in Mathematics (1917), no. 242
  license: Public domain (USA); author d. 1930
puzzle:
  text: |
    The man in our illustration is in a little dilemma. He has just been
    appointed inspector of a certain system of tube railways, and it is his
    duty to inspect regularly, within a stated period, all the company's
    seventeen lines connecting twelve stations, as shown on the big poster
    plan that he is contemplating. Now he wants to arrange his route so that
    it shall take him over all the lines with as little travelling as
    possible. He may begin where he likes and end where he likes. What is
    his shortest route?

    Could anything be simpler? But the reader will soon find that, however
    he decides to proceed, the inspector must go over some of the lines more
    than once. In other words, if we say that the stations are a mile apart,
    he will have to travel more than seventeen miles to inspect every line.
    There is the little difficulty. How far is he compelled to travel, and
    which route do you recommend?

    [Illustration]
  solution: |
    The inspector need only travel nineteen miles if he starts at B and
    takes the following route: BADGDEFIFCBEHKLIHGJK. Thus the only portions
    of line travelled over twice are the two sections D to G and F to I. Of
    course, the route may be varied, but it cannot be shortened.
level1:
  statement: "A tube network has 12 stations, laid out in a grid 3 across and 4 down, joined by 17 lines,
    each line 1 mile long. An inspector must travel along every line at least once. He may start and finish
    at any stations. What is the fewest miles he must travel?"
  answer: "19 miles."
  insight: "Count the lines meeting at each station. Six stations (the middle ones on the two long sides
    of the grid) have an odd number of lines, and a walk can only start or end at an odd station. So two
    of them are the start and the end, and the other four must be paired up by walking one short line
    twice. Pairing them takes 2 repeated miles, so the total is 17 + 2 = 19, and a search of every possible
    set of repeats shows that fewer is impossible."
level2:
  statement: "Same rules on a smaller network: 9 stations in a 3 by 3 grid, joined by 12 lines of 1 mile
    each. What is the fewest miles the inspector must travel?"
  answer: 14
  accept: [14, "14 miles", "fourteen", "Fourteen"]
  why: "The four middle-of-the-side stations are odd. Two are the start and end; the other two are 2 miles
    apart, so repeating that route adds 2. Total 12 + 2 = 14."
