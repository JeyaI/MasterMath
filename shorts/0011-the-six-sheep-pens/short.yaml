source:
  kind: dudeney-amusements
  credit: After Henry Ernest Dudeney, Amusements in Mathematics (1917), no. 205
  license: Public domain (USA); author d. 1930
puzzle:
  text: |
    [Illustration]

    Here is a new little puzzle with matches. It will be seen in the
    illustration that thirteen matches, representing a farmer's hurdles,
    have been so placed that they enclose six sheep-pens all of the same
    size. Now, one of these hurdles was stolen, and the farmer wanted still
    to enclose six pens of equal size with the remaining twelve. How was he
    to do it? All the twelve matches must be fairly used, and there must be
    no duplicated matches or loose ends.
  solution: |
    [Illustration] Place the twelve matches in the manner shown in the
    illustration, and you will have six pens of equal size.
level1:
  statement: >-
    A farmer has 12 matching hurdles, all the same length. Lay them flat, end to end,
    to fence six sheep-pens of exactly the same size. Every hurdle must be used,
    none may overlap another, and no end may be left loose. How?
  answer: Lay them as a hexagon with six spokes from the centre to the corners; the pens are six 
    equal triangles.
  insight: Pens need not be squares. Six equal triangles share their walls, so the six spokes do 
    double duty, and 6 rim + 6 spokes is exactly 12.
level2:
  statement: >-
    Same trick, one step further: lay matches to make a big triangle with three matches on each side,
    cut by lines of matches into small triangular pens, every pen with sides of one match. How many matches
    in all?
  answer: 18
  accept: [18, "18 matches", "eighteen", "Eighteen"]
  why: "Matches run in three directions, and each direction has 3 + 2 + 1 = 6 of them, so 3 x 6 = 18 (and
    there are 9 pens)."
