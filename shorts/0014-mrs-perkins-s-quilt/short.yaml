puzzle:
  text: |
    [Illustration]

    It will be seen that in this case the square patchwork quilt is built up
    of 169 pieces. The puzzle is to find the smallest possible number of
    square portions of which the quilt could be composed and show how they
    might be joined together. Or, to put it the reverse way, divide the
    quilt into as few square portions as possible by merely cutting the
    stitches.
  solution: |
    The following diagram shows how the quilt should be constructed.

    [Illustration]

    There is, I believe, practically only one solution to this puzzle. The
    fewest separate squares must be eleven. The portions must be of the
    sizes given, the three largest pieces must be arranged as shown, and the
    remaining group of eight squares may be "reflected," but cannot be
    differently arranged.
level1:
  statement: "A square quilt is sewn from 169 small square patches, 13 by 13. You may cut only along the
    stitches, every piece must be a square, and one piece can't be the whole quilt. What is the fewest
    number of square pieces the quilt can be cut into?"
  answer: "11 squares."
  insight: "Put big squares along the edges. A 7 square and a 6 square together fill one side (7 + 6 =
    13), and a second 6 square fills the other side. The gap left over, a 7 by 7 corner with one patch
    missing, is filled with eight squares of sizes 4, 3, 3, 2, 2, 2, 1 and 1. That makes 3 + 8 = 11 squares,
    and a search of every possible tiling shows that 10 or fewer is impossible."
level2:
  statement: "Same rules on a 5 by 5 quilt. What is the fewest number of square pieces?"
  answer: 8
  accept: [8, "8 squares", "eight", "Eight", "8 pieces"]
  why: "A 3 square in the corner, then three 2 squares (3 + 2 = 5 along each side), then four single patches
    fill the rest. Area 9 + 12 + 4 = 25, and 1 + 3 + 4 = 8 squares. Fewer is impossible."
