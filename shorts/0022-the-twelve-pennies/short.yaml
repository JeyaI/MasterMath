source:
  kind: dudeney-amusements
  credit: After Henry Ernest Dudeney, Amusements in Mathematics (1917), no. 230
  license: Public domain (USA); author d. 1930
puzzle:
  text: |
    Here is a pretty little puzzle that only requires twelve pennies or
    counters. Arrange them in a circle, as shown in the illustration. Now
    take up one penny at a time and, passing it over two pennies, place it
    on the third penny. Then take up another single penny and do the same
    thing, and so on, until, in six such moves, you have the coins in six
    pairs in the positions 1, 2, 3, 4, 5, 6. You can move in either
    direction round the circle at every play, and it does not matter
    whether the two jumped over are separate or a pair. This is quite easy
    if you use just a little thought.

    [Illustration]
  solution: |
    Here is one of several solutions. Move 12 to 3, 7 to 4, 10 to 6, 8 to 1,
    9 to 5, 11 to 2.
level1:
  statement: "Twelve pennies sit in a circle, numbered 1 to 12. A move lifts one single penny, jumps it
    over exactly two pennies (a pair counts as two), in either direction, and drops it on the penny just
    beyond. Empty places are skipped. Can you finish in six moves with the pennies in six pairs, on places
    1 to 6?"
  answer: "Yes: 12 to 3, 7 to 4, 10 to 6, 8 to 1, 9 to 5, 11 to 2."
  insight: "Every jump turns two single pennies into one pair, so six jumps is exactly what twelve pennies
    need. Only the pennies from places 7 to 12 move, each onto a penny from places 1 to 6, and the gaps
    they leave behind let later jumps reach across the empty places."
level2:
  statement: "Now 20 pennies sit in a circle, with the same kind of move: jump one single penny over two
    pennies and land on the next one. What is the fewest number of moves that turns all 20 into pairs?"
  answer: 10
  accept: [10, "10 moves", "ten", "ten moves"]
  why: "Each move turns two singles into one pair, so 20 singles need 20 / 2 = 10 moves, and 10 is achievable."
