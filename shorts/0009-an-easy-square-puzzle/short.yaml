puzzle:
  text: |
    If you take a rectangular piece of cardboard, twice as long as it is
    broad, and cut it in half diagonally, you will get two of the pieces
    shown in the illustration. The puzzle is with five such pieces of equal
    size to form a square. One of the pieces may be cut in two, but the
    others must be used intact.
  solution: |
    [Illustration

        +-----------------------------------------+
        |  .                                     /|
        |      .                                / |
        |          .                           /  |
        |                /                    /   |
        |               /    .               /    |
        |              /         .          /     |
        |             /              .     /      |
        |            /                   ./       |
        |           +--------------------+        |
        |          /                    /         |
        |         /                    /          |
        |        /                    /           |
        |       / .                  /            |
        |      /      .             /             |
        |     /           .        /              |
        |    /                .   /               |
        |   /                     .               |
        |  /                          .           |
        | /                               .       |
        |/                                    .   |
        +-----------------------------------------+

    ]

    The diagram explains itself, one of the five pieces having been cut in
    two to form a square.
level1:
  statement: "Five identical right triangles, each half of a 2 by 1 rectangle cut along its diagonal.
    Can you make a perfect square from all five, cutting only one of them in two?"
  answer: "Four whole triangles around a 1 by 1 hole; the fifth, cut once, fills the hole"
  insight: "Four triangles turn into a tilted square with a unit hole in the middle. The fifth triangle
    has area 1, the same as the hole: one vertical cut makes a trapezoid and a small triangle that slide
    and turn into it exactly."
level2:
  statement: "Now the triangles are twice as long as broad, with short side 3 and long side 6. Five of
    them make a square the same way. What is the area of that square?"
  answer: 45
  accept: [45, "45 square units", "area 45"]
  why: "Each triangle has area 3 x 6 / 2 = 9, and five of them make 45."
captions:
