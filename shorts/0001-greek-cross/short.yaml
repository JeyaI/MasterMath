  license: public-domain  # problem idea; our wording, drawings and animation are original

level1:
  statement: "Cut a plus-shaped cross of five 1×1 squares into 4 pieces that form a square."
  answer: "Two perpendicular cuts through the centre with slopes 1/2 and -2; the 4 pieces slide into a
    √5 × √5 square."
  insight: "Area 5 means side √5, which is the diagonal of a 2×1 box — so cut along those diagonals."

level2:
  statement: "How many degrees does each cut tilt from horizontal? (nearest degree)"
  answer: 27              # atan(1/2) = 26.57°, checked in verify.py
  accept: [27, 26.6, 26.57, 26.565]   # values that count as correct in comments
  why: "The cut is the diagonal of a 2×1 box, so tan θ = 1/2 → θ ≈ 26.57° ≈ 27°."

# Caption beats, in order (2–6 words each). The scene shows these in sync with the animation.
captions:
  - "5 squares, each 1×1"
  - "Cut it into 4 pieces…"
  - "Pause and try it"
  - "A square of area 5…"
  - "has side √5"
  - "…the diagonal of a 2×1 box!"
  - "Cut along it…"
  - "…and once more at 90°"
  - "4 identical pieces"
  - "Slide them over…"
  - "One perfect square ✓"
  - "Comment just the number ↓"

